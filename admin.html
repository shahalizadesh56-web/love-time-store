<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOVE TIME | مدیریت</title>
<style>
body{font-family:Tahoma,Arial;margin:0;background:#100d12;color:#f5eff5}
.wrap{max-width:1100px;margin:auto;padding:20px}
.card{background:#1b161e;border:1px solid #382d3a;border-radius:16px;padding:18px;margin:14px 0}
input,select,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #403441}
input{background:#0e0b10;color:#fff;width:100%;box-sizing:border-box;margin:8px 0}
button{cursor:pointer;background:#d7b46a;color:#17120d;font-weight:bold}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{padding:16px;background:#211a23;border-radius:12px}
.stat b{display:block;font-size:24px;margin-top:7px}
.muted{color:#aaa0ad;font-size:13px}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:10px;border-bottom:1px solid #332a35;text-align:right;font-size:13px}
.login{max-width:400px;margin:12vh auto}
.hidden{display:none}
@media(max-width:700px){
.stats{grid-template-columns:repeat(2,1fr)}
.table{min-width:760px}
.scroll{overflow:auto}
}
.error{color:#ff9da3}
</style>
</head>

<body>

<div id="login" class="card login">
<h2>LOVE TIME</h2>
<div class="muted">ورود به پنل مدیریت</div>
<input id="pass" type="password" placeholder="رمز مدیریت">
<button onclick="login()">ورود</button>
<div id="err" class="error"></div>
</div>

<div id="app" class="hidden">
<div class="wrap">

<div class="card">
<h1>پنل مدیریت LOVE TIME</h1>
<div class="muted">مدیریت سفارش‌های فروشگاه</div>
<br>
<button onclick="load()">بروزرسانی</button>
<button onclick="logout()">خروج</button>
</div>

<div class="stats">
<div class="stat">کل سفارش‌ها<b id="all">0</b></div>
<div class="stat">در انتظار<b id="pending">0</b></div>
<div class="stat">تکمیل‌شده<b id="done">0</b></div>
<div class="stat">فروش ثبت‌شده<b id="sales">0</b></div>
</div>

<div class="card">
<h2>سفارش‌ها</h2>

<div class="scroll">
<table class="table">
<thead>
<tr>
<th>شماره</th>
<th>مشتری</th>
<th>اقلام</th>
<th>مبلغ</th>
<th>وضعیت</th>
<th>تاریخ</th>
</tr>
</thead>

<tbody id="rows"></tbody>
</table>
</div>

</div>
</div>
</div>

<script>
let pw=sessionStorage.getItem('lt_admin')||'';

const fmt=n=>new Intl.NumberFormat('fa-IR').format(Number(n||0));

const h=()=>({
'Content-Type':'application/json',
'x-admin-password':pw
});

async function req(u,o={}){
const r=await fetch(u,{
...o,
headers:{...h(),...(o.headers||{})}
});

const d=await r.json().catch(()=>({}));

if(!r.ok)throw Error(d.error||'خطا');

return d;
}

async function login(){
pw=document.getElementById('pass').value.trim();

try{
await req('/api/admin/orders');

sessionStorage.setItem('lt_admin',pw);

document.getElementById('login').classList.add('hidden');
document.getElementById('app').classList.remove('hidden');

load();

}catch(e){
pw='';
document.getElementById('err').textContent=
'رمز صحیح نیست یا پنل هنوز فعال نشده است.';
}
}

function logout(){
sessionStorage.removeItem('lt_admin');
location.reload();
}

async function load(){

try{

const a=await req('/api/admin/orders');

let p=0,d=0,s=0;

document.getElementById('rows').innerHTML=

a.map(o=>{

if(o.status==='pending')p++;

if(o.status==='completed')d++;

s+=Number(o.total);

return `
<tr>
<td>${o.order_no}</td>

<td>
${o.customer_name}<br>
${o.phone}<br>
${o.address}
</td>

<td>
${(o.items||[])
.map(x=>x.name+' × '+x.quantity)
.join('، ')}
</td>

<td>${fmt(o.total)} تومان</td>

<td>
<select onchange="status('${o.order_no}',this.value)">
${opts(o.status)}
</select>
</td>

<td>${o.created_at||''}</td>

</tr>
`;

}).join('')||

'<tr><td colspan="6">سفارشی ثبت نشده است.</td></tr>';

document.getElementById('all').textContent=fmt(a.length);

document.getElementById('pending').textContent=fmt(p);

document.getElementById('done').textContent=fmt(d);

document.getElementById('sales').textContent=fmt(s)+' تومان';

}catch(e){

alert(e.message);

logout();

}

}

function opts(s){

return [
['pending','در انتظار'],
['confirmed','تأیید شده'],
['shipped','ارسال شده'],
['completed','تکمیل شده'],
['cancelled','لغو شده']
]
.map(x=>
`<option value="${x[0]}" ${s===x[0]?'selected':''}>${x[1]}</option>`
)
.join('');

}

async function status(no,s){

try{

await req(
'/api/admin/orders/'+encodeURIComponent(no),
{
method:'PATCH',
body:JSON.stringify({status:s})
}
);

load();

}catch(e){

alert(e.message);

}

}

if(pw)login();

</script>

</body>
</html>
